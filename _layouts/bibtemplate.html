---
---
{{reference}}
<br>
    {% if entry.abstract %}
    <button class="btn btnId btnPub--abstract button-4" type="button" aria-expanded="false" aria-controls="{{key}}-abstract">Abstract</button>
    {% endif %}

    {% unless entry.dontshowbib %}
    <button class="btn btnId btnPub--BibTex button-4" type="button" aria-expanded="false" aria-controls="{{key}}-bibtex">BibTeX</button>
    {% endunless %}
    
    {% if entry.url %}
    <a class="btn button-4 btnPub--download" href="{{entry.url}}">PDF</a>
    {% endif %}
    
    {% if entry.code %}
    <a class="btn button-4 btnPub--download" href="{{entry.code}}">Code</a>
    {% endif %}

    {% unless entry.dontshowbib %}
    <div class="dropDownBibtex" id="{{key}}-bibtex" style="display:none;">
    <pre>{{entry.bibtex}}</pre>
    </div>
    {% endunless %}
    
    <div class="dropDownAbstract" id="{{key}}-abstract" style="display:none;">
    {{entry.abstract}}
    </div>
