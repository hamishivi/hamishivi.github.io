title: Hamish Ivison
description: >-
  Research, publications, and writing by Hamish Ivison, a PhD student working on language model post-training and reinforcement learning.
baseurl: ""
url: "https://ivison.id.au"
author:
  name: Hamish Ivison
logo: /assets/static/me-400.jpg

# Header navigation pages
header_pages:
  - blog.md

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll/scholar

markdown: kramdown
exclude:
  - readme.md
  - AGENTS.md
  - scripts
  - tests
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - secrets*

social_links:
  - name: GitHub
    icon: github
    url: https://github.com/hamishivi
  - name: LinkedIn
    icon: linkedin
    url: https://www.linkedin.com/in/hamish-ivison-6a17a1118
  - name: Twitter
    icon: twitter
    url: https://twitter.com/hamishivi

scholar:
  first_year: 2020
  style: _bibliography/association-for-computational-linguistics.csl.txt
  bibliography_template: bibtemplate
  bibliography_list_tag: div
  bibliography_item_tag: div
