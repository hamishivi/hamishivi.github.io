MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  }

{% endif %}
<script type="module" src="https://unpkg.com/dark-mode-toggle@0.18.0"></script>
<script>
  function setYearExpanded(section, expanded) {
    const content = section.querySelector('.year-content');
    const button = section.querySelector('.toggle-button');
    const arrow = button ? button.querySelector('span') : null;

    if (!content || !button) return;

    content.style.display = expanded ? 'block' : 'none';
    button.setAttribute('aria-expanded', String(expanded));
    if (arrow) arrow.classList.toggle('up', expanded);
  }

  // Kept global because the year buttons call this function directly.
  function toggleArrow(year) {
    const section = document.getElementById(`year-${year}`);
    if (!section) return;
    const button = section.querySelector('.toggle-button');
    setYearExpanded(section, button.getAttribute('aria-expanded') !== 'true');
  }

  // Dark mode toggle handling
  document.addEventListener('DOMContentLoaded', function() {
    const toggle = document.querySelector('dark-mode-toggle');
    const root = document.documentElement;
    
    // Restore saved preference
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      root.setAttribute('data-theme', savedTheme);
      if (toggle) {
        toggle.mode = savedTheme;
      }
    }
    
    // Listen for toggle changes
    if (toggle) {
      toggle.addEventListener('colorschemechange', function(e) {
        const theme = e.detail.colorScheme;
        root.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
      });
    }

    // Accessible mobile navigation toggle
    const menuToggle = document.querySelector('.menu-toggle');
    const siteNav = document.querySelector('.site-nav');
    if (menuToggle && siteNav) {
      menuToggle.addEventListener('click', function() {
        const isExpanded = this.getAttribute('aria-expanded') === 'true';
        this.setAttribute('aria-expanded', String(!isExpanded));
        this.setAttribute('aria-label', isExpanded ? 'Open navigation menu' : 'Close navigation menu');
        siteNav.classList.toggle('is-open', !isExpanded);
      });
    }
    
    // Animated, mutually exclusive bibliography detail panels
    const detailButtons = Array.from(document.querySelectorAll('.btnId'));

    function closePublicationDetail(button, panel, immediate) {
      button.setAttribute('aria-expanded', 'false');
      button.classList.remove('dropped');
      panel.classList.remove('is-open');
      panel.setAttribute('aria-hidden', 'true');
      panel.inert = true;

      if (immediate) {
        panel.hidden = true;
        return;
      }

      let finished = false;
      const finishClosing = function() {
        if (finished) return;
        finished = true;
        if (!panel.classList.contains('is-open')) panel.hidden = true;
      };

      panel.addEventListener('transitionend', finishClosing, { once: true });
      window.setTimeout(finishClosing, 320);
    }

    detailButtons.forEach(function(btn) {
      const panel = document.getElementById(btn.dataset.target);
      if (!panel) return;

      closePublicationDetail(btn, panel, true);

      btn.addEventListener('click', function() {
        const shouldOpen = this.getAttribute('aria-expanded') !== 'true';

        detailButtons.forEach(function(otherButton) {
          if (otherButton.getAttribute('aria-expanded') !== 'true') return;
          const otherPanel = document.getElementById(otherButton.dataset.target);
          if (otherPanel) closePublicationDetail(otherButton, otherPanel, false);
        });

        if (shouldOpen) {
          panel.hidden = false;
          panel.inert = false;
          panel.setAttribute('aria-hidden', 'false');
          this.setAttribute('aria-expanded', 'true');
          this.classList.add('dropped');
          window.requestAnimationFrame(function() {
            panel.classList.add('is-open');
          });
        }
      });
    });

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }

      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();

      const copied = document.execCommand('copy');
      textarea.remove();
      return copied ? Promise.resolve() : Promise.reject(new Error('Copy failed'));
    }

    document.querySelectorAll('.copy-bibtex').forEach(function(button) {
      button.addEventListener('click', async function() {
        const target = document.getElementById(this.dataset.copyTarget);
        const status = document.getElementById(this.dataset.copyStatus);
        if (!target) return;

        window.clearTimeout(this.copyResetTimer);

        try {
          await copyText(target.textContent.trim());
          this.textContent = 'Copied';
          this.classList.add('is-copied');
          if (status) status.textContent = 'BibTeX copied to clipboard.';
        } catch (error) {
          this.textContent = 'Try again';
          this.classList.remove('is-copied');
          if (status) status.textContent = 'Unable to copy BibTeX.';
        }

        this.copyResetTimer = window.setTimeout(() => {
          this.textContent = 'Copy';
          this.classList.remove('is-copied');
        }, 1800);
      });
    });

    // Filter the blog archive by topic without leaving the page.
    const postItems = Array.from(document.querySelectorAll('#post-list .post-list-item'));
    const filterChips = Array.from(document.querySelectorAll('.filter-chip'));
    const postStatus = document.getElementById('post-filter-status');
    let activeTag = 'all';

    function filterPosts() {
      let visibleCount = 0;

      postItems.forEach(function(item) {
        const tags = (item.dataset.tags || '').toLowerCase().split(/\s+/);
        const isVisible = activeTag === 'all' || tags.includes(activeTag);
        item.hidden = !isVisible;
        visibleCount += isVisible ? 1 : 0;
      });

      if (postStatus) {
        postStatus.textContent = `${visibleCount} ${visibleCount === 1 ? 'post' : 'posts'}`;
      }
    }

    if (postItems.length) {
      filterChips.forEach(function(chip) {
        chip.addEventListener('click', function() {
          activeTag = (chip.dataset.tag || 'all').toLowerCase();
          filterChips.forEach(function(otherChip) {
            const isActive = otherChip === chip;
            otherChip.classList.toggle('is-active', isActive);
            otherChip.setAttribute('aria-pressed', String(isActive));
          });
          filterPosts();
        });
      });
      filterPosts();
    }

    // Expand or collapse all publication years at once.
    const publicationSections = Array.from(document.querySelectorAll('.year-section'));
    const expandPublications = document.getElementById('expand-publications');
    const collapsePublications = document.getElementById('collapse-publications');

    if (expandPublications && collapsePublications && publicationSections.length) {
      expandPublications.addEventListener('click', function() {
        publicationSections.forEach(function(section) {
          setYearExpanded(section, true);
        });
      });
      collapsePublications.addEventListener('click', function() {
        publicationSections.forEach(function(section) {
          setYearExpanded(section, false);
        });
      });
    }
  });
</script>
