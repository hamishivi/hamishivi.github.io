<ul class="social-media-list">
  {% for social in site.social_links %}
  <li>
    <a rel="me" href="{{ social.url }}" aria-label="{{ social.name }}" title="{{ social.name }}">
      <svg class="svg-icon" aria-hidden="true"><use href="{{ '/assets/social-icons.svg#' | append: social.icon | relative_url }}"></use></svg>
    </a>
  </li>
  {% endfor %}
  <li>
    <a href="{{ '/feed.xml' | relative_url }}" aria-label="RSS feed" title="RSS feed">
      <svg class="svg-icon" aria-hidden="true"><use href="{{ '/assets/social-icons.svg#rss' | relative_url }}"></use></svg>
    </a>
  </li>
</ul>
