<header class="site-header">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}"><span class="site-title-accent">H</span>amish <span class="site-title-accent">I</span>vison</a>
    <div class="header-controls">
      <nav class="site-nav" aria-label="Main navigation">
        {%- for path in site.header_pages -%}
          {%- assign nav_page = site.pages | where: 'path', path | first -%}
          <a class="page-link" href="{{ nav_page.url | relative_url }}"{% if page.url == nav_page.url %} aria-current="page"{% endif %}>{{ nav_page.title | escape }}</a>
        {%- endfor -%}
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false">
        <span class="theme-toggle-icon theme-toggle-sun" aria-hidden="true">☀︎</span>
        <span class="theme-toggle-icon theme-toggle-moon" aria-hidden="true">☾</span>
      </button>
    </div>
  </div>
</header>
